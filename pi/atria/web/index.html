<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ATRIA — Console de bord</title>
<link rel="icon" href="/static/mark.svg">
<link rel="stylesheet" href="/static/app.css">
<script>
  try {
    const t = localStorage.getItem("atria-theme");
    if (t) document.documentElement.dataset.theme = t;
  } catch {}
</script>
</head>
<body>

<header>
  <img src="/static/mark.svg" alt="">
  <span class="marque">Atria</span>

  <div class="chiffre"><b id="h-equipage">—</b><span>en service</span></div>
  <div class="chiffre"><b id="h-aptes">—</b><span>aptes</span></div>
  <div class="chiffre"><b id="h-vacants">—</b><span>postes vacants</span></div>
  <div class="chiffre"><b id="h-session">—</b><span>identité</span></div>
  <div class="chiffre"><b class="mono">AUCUN</b><span>lien terre</span></div>

  <span class="espace"></span>
  <button class="bouton-theme" id="theme" type="button">Sombre</button>
  <span class="badge-etat" id="h-etat">Systèmes nominaux</span>
</header>

<main>
  <div class="colonne">
    <section class="etire">
      <h2>Plan du vaisseau <em id="p-instr"></em></h2>
      <div class="corps">
        <svg id="plan" viewBox="0 0 620 390" preserveAspectRatio="xMidYMid meet"></svg>
      </div>
    </section>
    <section style="height:150px">
      <h2>Alertes <em id="a-nb"></em></h2>
      <div class="corps" id="alertes"></div>
    </section>
  </div>

  <div class="colonne">
    <section class="etire">
      <h2>Équipage <em id="e-nb"></em></h2>
      <div class="corps" id="equipage"></div>
    </section>
    <section style="height:158px">
      <h2>Prévisions <em>régression sur 24 h</em></h2>
      <div class="corps" id="previsions"></div>
    </section>
    <section class="etire">
      <h2>Journal des décisions <em>traçabilité</em></h2>
      <div class="corps" id="journal"></div>
    </section>
  </div>
</main>

<footer>
  <div class="historique" id="historique"></div>
  <form class="console" id="console">
    <span class="invite">ATRIA</span>
    <input id="question" autocomplete="off"
           placeholder="Pourquoi la capacité de reyes baisse ?   ·   qui peut tenir la chirurgie ?   ·   journal">
    <span class="mention" id="mention">lecture seule</span>
  </form>
</footer>

<script src="/static/ship.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
